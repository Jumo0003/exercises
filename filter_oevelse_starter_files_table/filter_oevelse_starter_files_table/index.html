<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>

<body>

    <table>

        <thead>
            <tr>
                <th>Type</th>
                <th>Fuel</th>
                <th>Passengers</th>
                <th>Stops</th>
                <th>Owned By</th>
                <th>Electric</th>
                <th>Tandem</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <div>
        <button class="btn" id="filter_btn" data-filter="isElectric">Filter på elektriske biler</button>
        <button class="btn" id="twoSeats" data-filter="moreThan2">Filter på biler med mere end 2 sæder
        </button>
        <button class="btn" id="elektriskJonas" data-filter="isElectricAndOwnedByJonas">Filter på el fartøjer ejet
            af
            Jonas</button>
        <button class="btn" id="rugbrød" data-filter="ryebreadFueled">Filter på Rugbrøddrevne fartøjer</button>
        <button class="btn" id="all_btn" data-filter="all">Vis alle</button>
        <button class="btn" id="allTheSeats" data-filter="allTheSeats">over 100 sæder
        </button>
    </div>

</body>

</html>
